name: Build IG Guard APK



on:

  push:

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4



      - name: Set up JDK 17

        uses: actions/setup-java@v4

        with:

          distribution: 'temurin'

          java-version: '17'



      - name: Set up Gradle

        uses: gradle/actions/setup-gradle@v3

        with:

          gradle-version: '8.7'



      - name: Assemble Android project structure and persistent signing key

        run: |

          mkdir -p app/src/main/java/com/example/igguard

          mkdir -p app/src/main/res/xml

          mkdir -p app/src/main/res/values



          # Use MainActivity_v4.kt or MainActivity.kt if valid v4, otherwise auto-unpack embedded v4.0 MainActivity.kt!

          if [ -f MainActivity_v4.kt ] && grep -q "object GuardEngine" MainActivity_v4.kt; then

            cp MainActivity_v4.kt app/src/main/java/com/example/igguard/MainActivity.kt

          elif [ -f MainActivity.kt ] && grep -q "object GuardEngine" MainActivity.kt; then

            cp MainActivity.kt app/src/main/java/com/example/igguard/MainActivity.kt

          else

            echo "Repo MainActivity.kt is outdated (missing GuardEngine); unpacking embedded v4.0 MainActivity.kt..."

            echo "" | base64 -d | gunzip > app/src/main/java/com/example/igguard/MainActivity.kt

          fi



          echo "" | base64 -d > app/ig_guard.keystore



          VER_CODE=$((100 + ${{ github.run_number }}))



          cat << 'EOF' | sed 's/^          //' > settings.gradle

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }

          dependencyResolutionManagement {

              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {

                  google()

                  mavenCentral()

              }

          }

          rootProject.name = "IGGuard"

          include(":app")

          EOF



          cat << 'EOF' | sed 's/^          //' > build.gradle

          plugins {

              id 'com.android.application' version '8.3.2' apply false

              id 'org.jetbrains.kotlin.android' version '1.9.23' apply false

          }

          EOF



          cat << EOF | sed 's/^          //' > app/build.gradle

          plugins {

              id 'com.android.application'

              id 'org.jetbrains.kotlin.android'

          }



          android {

              namespace 'com.example.igguard'

              compileSdk 34



              defaultConfig {

                  applicationId "com.example.igguard"

                  minSdk 26

                  targetSdk 34

                  versionCode $VER_CODE

                  versionName "4.${{ github.run_number }}"

              }



              signingConfigs {

                  persistentKey {

                      storeFile file("ig_guard.keystore")

                      storePassword "igguard2026"

                      keyAlias "igguard_key"

                      keyPassword "igguard2026"

                  }

              }



              buildTypes {

                  debug {

                      signingConfig signingConfigs.persistentKey

                  }

                  release {

                      minifyEnabled false

                      signingConfig signingConfigs.persistentKey

                  }

              }



              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17

              }

              kotlinOptions {

                  jvmTarget = '17'

              }

          }

          EOF



          cat << 'EOF' | sed 's/^          //' > app/src/main/res/values/strings.xml

          <resources>

              <string name="app_name">IG Guard</string>

              <string name="acc_desc">Keeps Instagram notifications enabled and protects teens from explicit messages.</string>

          </resources>

          EOF



          cat << 'EOF' | sed 's/^          //' > app/src/main/res/xml/accessibility_config.xml

          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:accessibilityFlags="flagDefault"

              android:canRetrieveWindowContent="true"

              android:description="@string/acc_desc"

              android:notificationTimeout="200"

              android:packageNames="com.instagram.android,com.android.settings,com.samsung.android.lool,com.miui.securitycenter,com.coloros.safecenter" />

          EOF



          cat << 'EOF' | sed 's/^          //' > app/src/main/AndroidManifest.xml

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />



              <application

                  android:label="@string/app_name"

                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">



                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:launchMode="singleTop"

                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                      <intent-filter>

                          <action android:name="android.intent.action.VIEW" />

                          <category android:name="android.intent.category.DEFAULT" />

                          <category android:name="android.intent.category.BROWSABLE" />

                          <data android:scheme="igguard" android:host="pair" />

                      </intent-filter>

                  </activity>



                  <service

                      android:name=".ParentAlertService"

                      android:exported="false"

                      android:foregroundServiceType="dataSync" />



                  <service

                      android:name=".IgNotificationListener"

                      android:label="IG Guard DM Reader"

                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"

                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.service.notification.NotificationListenerService" />

                      </intent-filter>

                  </service>



                  <service

                      android:name=".IgAccessibilityService"

                      android:label="IG Guard Anti-Tamper"

                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"

                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.accessibilityservice.AccessibilityService" />

                      </intent-filter>

                      <meta-data

                          android:name="android.accessibilityservice"

                          android:resource="@xml/accessibility_config" />

                  </service>



              </application>

          </manifest>

          EOF



      - name: Compile Signed APK

        run: gradle assembleDebug --no-daemon



      - name: Upload APK Artifact

        uses: actions/upload-artifact@v4

        with:

          name: ig-guard-apk

          path: app/build/outputs/apk/debug/app-debug.apk

