name: Build IG Guard APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One queue per ref: a push to an experimental branch can never evict or cancel a pending
# main deploy/build or a release-tag run. Relay deploys have their own fixed group below.
concurrency:
  group: ig-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Protected refs are main and the version tags scripts/publish-release.sh accepts. Only they may
  # sign, bind the `release` environment or publish. Keep this in step with that script.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      protected: ${{ steps.ref.outputs.protected }}
      environment: ${{ steps.ref.outputs.environment }}
    steps:
      - name: Classify the ref
        id: ref
        run: |
          set -euo pipefail
          protected=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            protected=true
          elif [[ "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+(\.[0-9]+)?(-beta\.[1-9][0-9]*|-hotfix\.[1-9][0-9]*)?$ ]]; then
            protected=true
          fi
          environment=ci-unprotected
          if [ "$protected" = true ]; then environment=release; fi
          echo "protected=$protected" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  relay-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout relay source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Test relay protocol, storage and 100-family workload
        working-directory: relay
        run: npm ci && npm test

  # Production deploy. Only this job can see Cloudflare secrets, and only on main or a hotfix tag.
  relay-deploy:
    needs: relay-test
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/4.8-hotfix.') }}
    environment: relay-prod
    concurrency:
      group: ig-guard-relay-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout relay source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install relay dependencies
        working-directory: relay
        run: npm ci

      - name: Deploy to the configured Cloudflare account
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npm run deploy | tee "$RUNNER_TEMP/relay-deployment.txt"
            python3 - "$RUNNER_TEMP/relay-deployment.txt" <<'PY'
          from pathlib import Path
          import re, sys
          for endpoint in dict.fromkeys(re.findall(r'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev',Path(sys.argv[1]).read_text())):
              print('::notice title=Cloudflare deployed endpoint::'+endpoint)
          PY
          else
            echo "::warning title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing. Checking the existing endpoint instead."
            echo "Cloudflare deployment credentials are not configured; checking the existing endpoint instead." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify deployed relay and authenticated offline delivery
        env:
          RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
        run: |
          set -euo pipefail
          status=0
          python3 scripts/relay-config.py --require --probe || status=1
          if (cd relay && npm run smoke); then
            echo "::notice title=Relay protocol::Authenticated WebSocket, offline delivery and signed receipt checks passed."
          else
            status=1
          fi
          exit "$status"

  build:
    needs: [plan, relay-test, relay-deploy]
    # relay-deploy is skipped on refs that do not deploy; a failed or cancelled test/deploy stops the build.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.relay-test.result == 'success' && (needs.relay-deploy.result == 'success' || needs.relay-deploy.result == 'skipped') }}
    # `release` (protected refs only) holds the signing secrets; other refs get an empty, unprotected environment.
    environment: ${{ needs.plan.outputs.environment }}
    runs-on: ubuntu-24.04
    env:
      RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
    outputs:
      artifact_name: ${{ steps.package_signed.outputs.artifact_name || steps.package_unsigned.outputs.artifact_name }}
      signed_verified: ${{ steps.verify.outputs.signed_verified }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.7'

      - name: Assemble Android project structure
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/app/family/igguard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          cp -R ui-res/. app/src/main/res/
          cp AppConsent.kt FamilySecurity.kt LocalVault.kt FamilyEvidence.kt ConversationCapture.kt FamilyRelay.kt CloudRelay.kt app/src/main/java/app/family/igguard/
          mkdir -p app/src/main/assets
          cp docs/ig-guard-terms-of-service.md app/src/main/assets/ig-guard-terms-of-service.md
          python3 scripts/relay-config.py --output app/relay-config.json

          if [ -f MainActivity.kt ] && grep -q "object GuardEngine" MainActivity.kt; then
            sed "s/^package .*/package app.family.igguard/" MainActivity.kt > app/src/main/java/app/family/igguard/MainActivity.kt
          elif [ -f MainActivity_v4.kt ] && grep -q "object GuardEngine" MainActivity_v4.kt; then
            sed "s/^package .*/package app.family.igguard/" MainActivity_v4.kt > app/src/main/java/app/family/igguard/MainActivity.kt
          else
            echo "ERROR: No MainActivity source containing GuardEngine was found." >&2
            exit 1
          fi


          VER_CODE=$((100 + ${{ github.run_number }}))
          if [ "$VER_CODE" -le 150 ]; then VER_CODE=151; fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IGGuard"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
          }
          EOF

          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'app.family.igguard'
              compileSdk 34
              buildFeatures { buildConfig true }

              defaultConfig {
                  applicationId "app.family.igguard"
                  minSdk 26
                  targetSdk 34
                  versionCode $VER_CODE
                  versionName "4.9-beta.3"
              }

              signingConfigs {
                  privateRelease {
                      if (System.getenv('APK_KEYSTORE_PATH')) {
                          storeFile file(System.getenv('APK_KEYSTORE_PATH'))
                          storePassword System.getenv('APK_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('APK_KEY_ALIAS')
                          keyPassword System.getenv('APK_KEY_PASSWORD')
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      if (System.getenv('APK_KEYSTORE_PATH')) signingConfig signingConfigs.privateRelease
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          def relayConfig = new groovy.json.JsonSlurper().parse(file('relay-config.json'))
          android.defaultConfig.buildConfigField 'String', 'RELAY_BASE_URL', groovy.json.JsonOutput.toJson(relayConfig.base_url)
          tasks.matching { it.name == 'packageRelease' }.configureEach {
              doFirst {
                  if (!relayConfig.base_url) throw new GradleException('[RELAY_CONFIG] Deploy and configure the relay before release packaging.')
              }
          }
          dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">IG Guard</string>
              <string name="acc_desc">Keeps Instagram notifications enabled and protects teens from explicit messages.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="200"
              android:packageNames="com.instagram.android" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <permission android:name="app.family.igguard.INTERNAL" android:protectionLevel="signature" />
              <uses-permission android:name="app.family.igguard.INTERNAL" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@xml/private_data_rules"
                  android:usesCleartextTraffic="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <meta-data android:name="isMonitoringTool" android:value="child_monitoring" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="igguard" android:host="pair" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ParentAlertService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <service
                      android:name=".IgNotificationListener"
                      android:label="IG Guard DM Reader"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".IgAccessibilityService"
                      android:label="IG Guard Anti-Tamper"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Run regression checks
        run: |
          python3 -m unittest discover -s tests -p 'check_*.py'
          mkdir -p app/src/test/java/app/family/igguard
          cp tests/*.kt app/src/test/java/app/family/igguard/
          mkdir -p app/src/test/resources
          printf 'application=app.family.igguard.VaultTestApplication\n' > app/src/test/resources/robolectric.properties
          cat >> app/build.gradle <<'EOF'
          android { testOptions {
              unitTests.includeAndroidResources = true
              unitTests.all {
                  maxHeapSize = '1g'
                  systemProperty 'igguard.protocol.vector', new File(rootDir, 'relay/test/protocol-vector.json').absolutePath
              }
          } }
          android { buildTypes { debug { buildConfigField 'String', 'RELAY_BASE_URL', '""' } } }
          dependencies {
              testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.json:json:20240303'
              testImplementation 'org.robolectric:robolectric:4.14.1'
          }
          EOF
          gradle testDebugUnitTest lintDebug --no-daemon

      - name: Compile unsigned APK
        id: package_unsigned
        if: needs.plan.outputs.protected != 'true'
        run: |
          set -euo pipefail
          unset APK_KEYSTORE_PATH
          echo "Signing secrets are not available on this ref. This unsigned APK is for CI inspection only and cannot update an installed IG Guard." >> "$GITHUB_STEP_SUMMARY"
          gradle assembleRelease --no-daemon
          echo "artifact_name=ig-guard-unsigned-apk" >> "$GITHUB_OUTPUT"

      - name: Compile Signed APK
        id: package_signed
        if: needs.plan.outputs.protected == 'true'
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$APK_KEYSTORE_BASE64" "$APK_KEYSTORE_PASSWORD" "$APK_KEY_ALIAS" "$APK_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" != 0 ] && [ "$configured" != 4 ]; then
            echo "Configure all four APK signing secrets; partial signing configuration is rejected." >&2
            exit 1
          fi
          unset APK_KEYSTORE_PATH
          if [ "$configured" = 4 ]; then
            umask 077
            export APK_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/ig-guard-key.XXXXXX")"
            trap 'rm -f "$APK_KEYSTORE_PATH" "$APK_KEYSTORE_PATH.csr"' EXIT
            if ! printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$APK_KEYSTORE_PATH"; then
              echo "::error::[SIGNING_BASE64] APK_KEYSTORE_BASE64 is not valid Base64. Supply the encoded keystore contents, not a filename."
              exit 1
            fi
            if ! keytool -list -keystore "$APK_KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD </dev/null >/dev/null 2>&1; then
              echo "::error::[SIGNING_STORE] The decoded keystore cannot be opened with APK_KEYSTORE_PASSWORD. Verify that password on the exact local file and replace the Base64 secret from that file."
              exit 1
            fi
            if ! keytool -list -keystore "$APK_KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD -alias "$APK_KEY_ALIAS" </dev/null >/dev/null 2>&1; then
              echo "::error::[SIGNING_ALIAS] The keystore opened successfully, but APK_KEY_ALIAS does not identify an entry in it."
              exit 1
            fi
            if ! keytool -certreq -keystore "$APK_KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD -alias "$APK_KEY_ALIAS" -keypass:env APK_KEY_PASSWORD -file "$APK_KEYSTORE_PATH.csr" </dev/null >/dev/null 2>&1; then
              echo "::error::[SIGNING_KEY_PASSWORD] The keystore and alias are valid, but the private key cannot be used with APK_KEY_PASSWORD. If you used one password, put that same value in both password secrets."
              exit 1
            fi
            echo "Signing keystore, alias and private-key password verified."
            artifact_name=ig-guard-signed-apk
          else
            artifact_name=ig-guard-unsigned-apk
            echo "Signing secrets are not configured. This unsigned APK requires private signing before installation. See docs/signing.md." >> "$GITHUB_STEP_SUMMARY"
          fi
          gradle assembleRelease --no-daemon
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK
        id: verify
        if: steps.package_signed.outputs.artifact_name == 'ig-guard-signed-apk'
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
            certificate="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt")"
            test "$certificate" = "0eb6f30787c2d6dc23136a28cfd7a08a7956e5fe0565ba142f6711be38ca3f0e"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
            grep -q "name='app.family.igguard'" "$RUNNER_TEMP/apk-badging.txt"
            grep -q "versionName='4.9-beta.3'" "$RUNNER_TEMP/apk-badging.txt"
            code="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/apk-badging.txt" | head -1)"
            test "$code" -gt 150
            unzip -p "$apk" assets/ig-guard-terms-of-service.md > "$RUNNER_TEMP/apk-terms.md"
            cmp docs/ig-guard-terms-of-service.md "$RUNNER_TEMP/apk-terms.md"
            if grep -q '^application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
              echo "::error::A debuggable APK cannot replace the release download."
              exit 1
            fi
          done
          echo "signed_verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package_signed.outputs.artifact_name || steps.package_unsigned.outputs.artifact_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: [plan, relay-test, relay-deploy, build]
    # always() exists so a tag whose build FAILED still publishes the documented notes-only release
    # (docs/releases/4.7.md). It no longer publishes when the relay tests or deploy failed (build is then
    # skipped), when the run was cancelled, or for refs that are not release tags.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && github.event.deleted != true && needs.plan.outputs.protected == 'true' && needs.relay-test.result == 'success' && (needs.relay-deploy.result == 'success' || needs.relay-deploy.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source and release notes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download verified signed APK
        id: download
        if: needs.build.result == 'success' && needs.build.outputs.artifact_name == 'ig-guard-signed-apk' && needs.build.outputs.signed_verified == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ig-guard-signed-apk
          path: release-artifacts

      - name: Publish release or notes-only fallback
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          APK_VERIFIED: ${{ needs.build.outputs.signed_verified }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
        run: bash scripts/publish-release.sh
