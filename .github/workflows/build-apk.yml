name: Build IG Guard APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One queue per ref: a push to an experimental branch can never evict or cancel a pending
# main deploy/build or a release-tag run. Relay deploys have their own fixed group below.
concurrency:
  group: ig-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Protected refs are main and the version tags scripts/publish-release.sh accepts. Only they may
  # sign, bind the `release` environment or publish. Keep this in step with that script.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      protected: ${{ steps.ref.outputs.protected }}
      environment: ${{ steps.ref.outputs.environment }}
    steps:
      - name: Classify the ref
        id: ref
        run: |
          set -euo pipefail
          protected=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            protected=true
          elif [[ "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+(\.[0-9]+)?(-beta\.[1-9][0-9]*|-hotfix\.[1-9][0-9]*)?$ ]]; then
            protected=true
          fi
          environment=ci-unprotected
          if [ "$protected" = true ]; then environment=release; fi
          echo "protected=$protected" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  relay-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout relay source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Test relay protocol, storage and 100-family workload
        working-directory: relay
        run: npm ci && npm test

  # Production deploy. Only this job can see Cloudflare secrets, and only on main or a hotfix tag.
  relay-deploy:
    needs: relay-test
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/4.8-hotfix.') }}
    environment: relay-prod
    concurrency:
      group: ig-guard-relay-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout relay source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install relay dependencies
        working-directory: relay
        run: npm ci

      - name: Deploy to the configured Cloudflare account
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npm run deploy | tee "$RUNNER_TEMP/relay-deployment.txt"
            python3 - "$RUNNER_TEMP/relay-deployment.txt" <<'PY'
          from pathlib import Path
          import re, sys
          for endpoint in dict.fromkeys(re.findall(r'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev',Path(sys.argv[1]).read_text())):
              print('::notice title=Cloudflare deployed endpoint::'+endpoint)
          PY
          else
            echo "::warning title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing. Checking the existing endpoint instead."
            echo "Cloudflare deployment credentials are not configured; checking the existing endpoint instead." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify deployed relay and authenticated offline delivery
        env:
          RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
        run: |
          set -euo pipefail
          status=0
          python3 scripts/relay-config.py --require --probe || status=1
          if (cd relay && npm run smoke); then
            echo "::notice title=Relay protocol::Authenticated WebSocket, offline delivery and signed receipt checks passed."
          else
            status=1
          fi
          exit "$status"

  build:
    needs: [plan, relay-test, relay-deploy]
    # relay-deploy is skipped on refs that do not deploy; a failed or cancelled test/deploy stops the build.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.relay-test.result == 'success' && (needs.relay-deploy.result == 'success' || needs.relay-deploy.result == 'skipped') }}
    # `release` (protected refs only) holds the signing secrets; other refs get an empty, unprotected environment.
    environment: ${{ needs.plan.outputs.environment }}
    runs-on: ubuntu-24.04
    env:
      RELAY_BASE_URL: ${{ vars.RELAY_BASE_URL }}
      # The one place the release model is fetched from (uploaded by hand to the `model-beacon` release; never in git).
      # Its last path segment must equal RiskModelSpec.FILE_NAME in RiskModel.kt; the packaging step checks that.
      MODEL_URL: https://github.com/Derek317/Parent-Child-Protection-System/releases/download/model-beacon/qwen3-1.7b-beacon-Q4_K_M.gguf
    outputs:
      artifact_name: ${{ steps.package_signed.outputs.artifact_name || steps.package_unsigned.outputs.artifact_name }}
      signed_verified: ${{ steps.verify.outputs.signed_verified }}
      model_packaged: ${{ steps.package_model.outputs.model_packaged }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.7'

      - name: Assemble Android project structure
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/app/family/igguard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          cp -R ui-res/. app/src/main/res/
          cp *.kt app/src/main/java/app/family/igguard/
          mkdir -p app/src/main/assets
          cp docs/ig-guard-terms-of-service.md app/src/main/assets/ig-guard-terms-of-service.md
          python3 scripts/relay-config.py --output app/relay-config.json

          # Native scoring library (llama.cpp b12503 via native/risk). IG_GUARD_SKIP_NATIVE=1 leaves it out
          # of the generated project (tests/run_android.sh does this for unit tests, which never load it).
          if [ "${IG_GUARD_SKIP_NATIVE:-0}" != 1 ]; then
            LLAMA_PIN=4577932fab595eaa8b27ad71734d5de1f3c07d8c
            LLAMA_DIR="${IG_GUARD_LLAMA_DIR:-${RUNNER_TEMP:-$(dirname "$PWD")}/llama.cpp-b12503}"
            if [ ! -d "$LLAMA_DIR/.git" ]; then
              mkdir -p "$LLAMA_DIR"
              git -C "$LLAMA_DIR" init -q
              git -C "$LLAMA_DIR" remote add origin https://github.com/ggml-org/llama.cpp.git
              git -C "$LLAMA_DIR" fetch -q --depth 1 origin "$LLAMA_PIN"
              git -C "$LLAMA_DIR" checkout -q FETCH_HEAD
            fi
            if [ "$(git -C "$LLAMA_DIR" rev-parse HEAD)" != "$LLAMA_PIN" ]; then
              echo "ERROR: llama.cpp at $LLAMA_DIR is not commit $LLAMA_PIN (tag b12503)." >&2
              exit 1
            fi
            mkdir -p app/src/main/cpp/risk
            cp native/risk/CMakeLists.txt native/risk/risk_core.h native/risk/risk_core.cpp native/risk/risk_jni.cpp native/risk/host_check.cpp app/src/main/cpp/risk/
          fi

          if [ -f MainActivity.kt ] && grep -q "object GuardEngine" MainActivity.kt; then
            sed "s/^package .*/package app.family.igguard/" MainActivity.kt > app/src/main/java/app/family/igguard/MainActivity.kt
          elif [ -f MainActivity_v4.kt ] && grep -q "object GuardEngine" MainActivity_v4.kt; then
            sed "s/^package .*/package app.family.igguard/" MainActivity_v4.kt > app/src/main/java/app/family/igguard/MainActivity.kt
          else
            echo "ERROR: No MainActivity source containing GuardEngine was found." >&2
            exit 1
          fi


          VER_CODE=$((100 + ${{ github.run_number }}))
          if [ "$VER_CODE" -le 150 ]; then VER_CODE=151; fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IGGuard"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
          }
          EOF

          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'app.family.igguard'
              compileSdk 34
              buildFeatures { buildConfig true }

              defaultConfig {
                  applicationId "app.family.igguard"
                  minSdk 26
                  targetSdk 34
                  versionCode $VER_CODE
                  versionName "5.1"
              }

              signingConfigs {
                  privateRelease {
                      if (System.getenv('APK_KEYSTORE_PATH')) {
                          storeFile file(System.getenv('APK_KEYSTORE_PATH'))
                          storePassword System.getenv('APK_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('APK_KEY_ALIAS')
                          keyPassword System.getenv('APK_KEY_PASSWORD')
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      if (System.getenv('APK_KEYSTORE_PATH')) signingConfig signingConfigs.privateRelease
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          def relayConfig = new groovy.json.JsonSlurper().parse(file('relay-config.json'))
          android.defaultConfig.buildConfigField 'String', 'RELAY_BASE_URL', groovy.json.JsonOutput.toJson(relayConfig.base_url)
          tasks.matching { it.name == 'packageRelease' }.configureEach {
              doFirst {
                  if (!relayConfig.base_url) throw new GradleException('[RELAY_CONFIG] Deploy and configure the relay before release packaging.')
              }
          }
          dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
          EOF

          if [ "${IG_GUARD_SKIP_NATIVE:-0}" != 1 ]; then
            cat >> app/build.gradle <<EOF
          android {
              ndkVersion '27.2.12479018'
              defaultConfig {
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild {
                      cmake { arguments '-DLLAMA_CPP_DIR=$LLAMA_DIR', '-DANDROID_STL=c++_static' }
                  }
              }
              externalNativeBuild {
                  cmake { path 'src/main/cpp/risk/CMakeLists.txt'; version '3.22.1' }
              }
          }
          EOF
          fi

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">IG Guard</string>
              <string name="acc_desc">Keeps Instagram notifications enabled and protects teens from explicit messages.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="200"
              android:packageNames="com.instagram.android" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <permission android:name="app.family.igguard.INTERNAL" android:protectionLevel="signature" />
              <uses-permission android:name="app.family.igguard.INTERNAL" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@xml/private_data_rules"
                  android:usesCleartextTraffic="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <meta-data android:name="isMonitoringTool" android:value="child_monitoring" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="igguard" android:host="pair" />
                      </intent-filter>
                  </activity>

                  <service android:name=".ArchiveMaintenanceJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />

                  <service android:name=".RiskScoringJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />

                  <service
                      android:name=".ParentAlertService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <service
                      android:name=".IgNotificationListener"
                      android:label="IG Guard DM Reader"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".IgAccessibilityService"
                      android:label="IG Guard Anti-Tamper"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

      # Robolectric normally downloads one android-all-instrumented jar per emulated SDK from Maven
      # Central while the tests run; a failed download there fails every Robolectric test. The jars
      # are fetched here instead, with retries, mirrors and pinned checksums, cached between runs, and
      # the tests run with robolectric.offline=true. Update the list and the cache key when the
      # Robolectric version or the `sdk =` values in tests/*.kt change. For 4.14.1 that is SDK 26, 28
      # and 34 from the tests, plus 35, the newest runtime, which Robolectric loads for every test.
      - name: Restore Robolectric Android runtimes
        id: robolectric-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.robolectric-android-all
          key: robolectric-android-all-4.14.1-i7-sdk26-28-34-35

      - name: Fetch Robolectric Android runtimes
        run: |
          set -euo pipefail
          dir="$HOME/.robolectric-android-all"
          path=maven2/org/robolectric/android-all-instrumented
          # Maven Central rate-limits hosted runners (HTTP 429), so Google's mirror of it is tried first.
          # The pinned SHA-256 values make the source irrelevant to what is accepted.
          mirrors="https://maven-central.storage-download.googleapis.com https://repo.maven.apache.org https://repo1.maven.org"
          mkdir -p "$dir"
          while read -r version sha256; do
            jar="android-all-instrumented-$version.jar"
            if [ -f "$dir/$jar" ] && echo "$sha256  $dir/$jar" | sha256sum -c --status; then
              echo "$jar: present"
              continue
            fi
            ok=0
            for attempt in 1 2 3 4; do
              for mirror in $mirrors; do
                if curl -fsSL --connect-timeout 20 --max-time 600 -o "$dir/$jar.part" "$mirror/$path/$version/$jar" \
                  && echo "$sha256  $dir/$jar.part" | sha256sum -c --status; then
                  mv "$dir/$jar.part" "$dir/$jar"
                  ok=1
                  break 2
                fi
                echo "::warning::$jar: download from $mirror failed (attempt $attempt)"
                rm -f "$dir/$jar.part"
              done
              sleep $((attempt * 15))
            done
            if [ "$ok" != 1 ]; then
              echo "::error::Could not download $jar from any Maven mirror."
              exit 1
            fi
            echo "$jar: downloaded"
          done <<'JARS'
          8.0.0_r4-robolectric-r1-i7 712196356bf61fbcb186f41135c33e6d3416be31543d7be120a33bc898cc1208
          9-robolectric-4913185-2-i7 dbb1c88987b54cef3132695a1b4d2f4851ba06286a6fa7d15772f98fd1f0cdf7
          14-robolectric-10818077-i7 3fdac2d463f431c6b8d83b9d0ca739e795de75fffedee648c6761bd4bd864701
          15-robolectric-12650502-i7 33c2d7cc4186d4605269d5d411fa1818972c5b30a9f70bfbbd3d430b076af52f
          JARS

      - name: Save Robolectric Android runtimes
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.robolectric-android-all
          key: ${{ steps.robolectric-cache.outputs.cache-primary-key }}

      - name: Run regression checks
        run: |
          python3 -m unittest discover -s tests -p 'check_*.py'
          mkdir -p app/src/test/java/app/family/igguard
          cp tests/*.kt app/src/test/java/app/family/igguard/
          mkdir -p app/src/test/resources
          printf 'application=app.family.igguard.VaultTestApplication\n' > app/src/test/resources/robolectric.properties
          cat >> app/build.gradle <<'EOF'
          android { testOptions {
              unitTests.includeAndroidResources = true
              unitTests.all {
                  maxHeapSize = '1g'
                  systemProperty 'robolectric.offline', 'true'
                  systemProperty 'robolectric.dependency.dir', new File(System.getProperty('user.home'), '.robolectric-android-all').absolutePath
                  systemProperty 'igguard.protocol.vector', new File(rootDir, 'relay/test/protocol-vector.json').absolutePath
              }
          } }
          android { buildTypes { debug { buildConfigField 'String', 'RELAY_BASE_URL', '""' } } }
          dependencies {
              testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.json:json:20240303'
              testImplementation 'org.robolectric:robolectric:4.14.1'
          }
          EOF
          if ! gradle testDebugUnitTest lintDebug --no-daemon; then
            # Gradle prints only the exception type; show which runtime jar Robolectric could not open, if any.
            grep -rhoE -m1 '(Path is not a file|Unable to read file): [^<&"]*' app/build/test-results 2>/dev/null | sort -u | sed 's/^/::error::Robolectric offline runtime: /' || true
            ls -la "$HOME/.robolectric-android-all" || true
            exit 1
          fi

      - name: Compile unsigned APK
        id: package_unsigned
        if: needs.plan.outputs.protected != 'true'
        run: |
          set -euo pipefail
          unset APK_KEYSTORE_PATH
          echo "Signing secrets are not available on this ref. This unsigned APK is for CI inspection only and cannot update an installed IG Guard." >> "$GITHUB_STEP_SUMMARY"
          gradle assembleRelease --no-daemon
          echo "artifact_name=ig-guard-unsigned-apk" >> "$GITHUB_OUTPUT"

      - name: Compile Signed APK
        id: package_signed
        if: needs.plan.outputs.protected == 'true'
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$APK_KEYSTORE_BASE64" "$APK_KEYSTORE_PASSWORD" "$APK_KEY_ALIAS" "$APK_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" != 0 ] && [ "$configured" != 4 ]; then
            echo "Configure all four APK signing secrets; partial signing configuration is rejected." >&2
            exit 1
          fi
          unset APK_KEYSTORE_PATH
          if [ "$configured" = 4 ]; then
            umask 077
            export APK_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/ig-guard-key.XXXXXX")"
            trap 'rm -f "$APK_KEYSTORE_PATH" "$APK_KEYSTORE_PATH.csr"' EXIT
            if ! printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$APK_KEYSTORE_PATH"; then
              echo "::error::[SIGNING_BASE64] APK_KEYSTORE_BASE64 is not valid Base64. Supply the encoded keystore contents, not a filename."
              exit 1
            fi
            if ! keytool -list -keystore "$APK_KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD </dev/null >/dev/null 2>&1; then
              echo "::error::[SIGNING_STORE] The decoded keystore cannot be opened with APK_KEYSTORE_PASSWORD. Verify that password on the exact local file and replace the Base64 secret from that file."
              exit 1
            fi
            if ! keytool -list -keystore "$APK_KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD -alias "$APK_KEY_ALIAS" </dev/null >/dev/null 2>&1; then
              echo "::error::[SIGNING_ALIAS] The keystore opened successfully, but APK_KEY_ALIAS does not identify an entry in it."
              exit 1
            fi
            if ! keytool -certreq -keystore "$APK_KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD -alias "$APK_KEY_ALIAS" -keypass:env APK_KEY_PASSWORD -file "$APK_KEYSTORE_PATH.csr" </dev/null >/dev/null 2>&1; then
              echo "::error::[SIGNING_KEY_PASSWORD] The keystore and alias are valid, but the private key cannot be used with APK_KEY_PASSWORD. If you used one password, put that same value in both password secrets."
              exit 1
            fi
            echo "Signing keystore, alias and private-key password verified."
            artifact_name=ig-guard-signed-apk
          else
            artifact_name=ig-guard-unsigned-apk
            echo "Signing secrets are not configured. This unsigned APK requires private signing before installation. See docs/signing.md." >> "$GITHUB_STEP_SUMMARY"
          fi
          gradle assembleRelease --no-daemon
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Verify signed APK
        id: verify
        if: steps.package_signed.outputs.artifact_name == 'ig-guard-signed-apk'
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
            certificate="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt")"
            test "$certificate" = "0eb6f30787c2d6dc23136a28cfd7a08a7956e5fe0565ba142f6711be38ca3f0e"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
            grep -q "name='app.family.igguard'" "$RUNNER_TEMP/apk-badging.txt"
            grep -q "versionName='5.1'" "$RUNNER_TEMP/apk-badging.txt"
            code="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/apk-badging.txt" | head -1)"
            test "$code" -gt 150
            unzip -p "$apk" assets/ig-guard-terms-of-service.md > "$RUNNER_TEMP/apk-terms.md"
            cmp docs/ig-guard-terms-of-service.md "$RUNNER_TEMP/apk-terms.md"
            if grep -q '^application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
              echo "::error::A debuggable APK cannot replace the release download."
              exit 1
            fi
          done
          echo "signed_verified=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package_signed.outputs.artifact_name || steps.package_unsigned.outputs.artifact_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      # Version tags only: the released APK carries the model. The keystore stays in this job (decoded to $RUNNER_TEMP again,
      # passwords only through the environment). Any failure fails the build, so the release never gets a model-free APK.
      - name: Package release APK with the model
        id: package_model
        if: needs.plan.outputs.protected == 'true' && startsWith(github.ref, 'refs/tags/') && steps.verify.outputs.signed_verified == 'true'
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          IG_GUARD_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          IG_GUARD_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Release APK with the model::$1"; exit 1; }
          spec="$(python3 -c 'import sys; sys.path.insert(0, "tools"); import package_with_model as p; s = p.load_spec(); print(s.file_name, s.size, p.pinned_certificate() or "-")')" || fail "Cannot read the pinned model from RiskModel.kt."
          read -r model_name model_bytes pinned <<< "$spec"
          if [ "${MODEL_URL##*/}" != "$model_name" ]; then
            fail "MODEL_URL ends in ${MODEL_URL##*/} but RiskModel.kt pins $model_name. Upload the new model to the model-beacon release and update MODEL_URL."
          fi
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" != 1 ] || [ ! -s "${apks[0]}" ]; then fail "Expected exactly one verified signed APK to package."; fi
          umask 077
          model="$RUNNER_TEMP/model/$model_name"
          keystore="$(mktemp "$RUNNER_TEMP/ig-guard-key.XXXXXX")"
          trap 'rm -f "$keystore" "$model"' EXIT
          mkdir -p "$RUNNER_TEMP/model" "$RUNNER_TEMP/release-apk"
          df -h "$RUNNER_TEMP"
          if ! curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 5 --retry-all-errors --output "$model" "$MODEL_URL"; then
            fail "Could not download the model from $MODEL_URL. Check that the model-beacon release and its asset exist. No release APK without the model is published."
          fi
          if ! printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$keystore"; then
            fail "[SIGNING_BASE64] APK_KEYSTORE_BASE64 is not valid Base64."
          fi
          unset APK_KEYSTORE_BASE64
          out="$RUNNER_TEMP/release-apk/IG-Guard-with-model.apk"
          # The script checks the model's size and SHA-256 against RiskModel.kt, signs v2+v3 and verifies; stdin is not a terminal, so it never prompts.
          if ! python3 tools/package_with_model.py --apk "${apks[0]}" --model "$model" --out "$out" --keystore "$keystore" \
              --ks-alias "$APK_KEY_ALIAS" --build-tools "$ANDROID_HOME/build-tools/34.0.0" < /dev/null; then
            fail "tools/package_with_model.py could not package the model (see the ERROR above). No release APK without the model is published."
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$out" > "$RUNNER_TEMP/model-apk-certificate.txt" || fail "apksigner could not verify the packaged APK."
          certificate="$(sed -nE 's/^(Signer #1|V3\.0 Signer:) certificate SHA-256 digest: //p' "$RUNNER_TEMP/model-apk-certificate.txt" | head -1)"
          # Same pinned digest as "Verify signed APK" (read from that step's test line by package_with_model.pinned_certificate).
          if [ "$pinned" = - ] || [ "$certificate" != "$pinned" ]; then
            fail "The packaged APK is not signed with the pinned release certificate."
          fi
          python3 - "$out" "assets/risk/$model_name" "$model_bytes" <<'PY' || fail "The packaged APK does not contain assets/risk/$model_name uncompressed with the pinned size."
          import sys, zipfile
          apk, entry, size = sys.argv[1], sys.argv[2], int(sys.argv[3])
          info = zipfile.ZipFile(apk).getinfo(entry)
          sys.exit(0 if info.compress_type == zipfile.ZIP_STORED and info.file_size == info.compress_size == size else 1)
          PY
          echo "model_packaged=true" >> "$GITHUB_OUTPUT"

      - name: Upload release APK with the model
        if: steps.package_model.outputs.model_packaged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ig-guard-release-apk
          path: ${{ runner.temp }}/release-apk/*.apk
          if-no-files-found: error
          compression-level: 0
          # The release asset is the durable copy; this 1.1 GB artifact only carries it to the release job.
          retention-days: 1

  release:
    needs: [plan, relay-test, relay-deploy, build]
    # A tag whose build FAILED still publishes the documented notes-only release (docs/releases/4.7.md),
    # so a failed build is accepted here. It does not publish when the relay tests or deploy failed (build is
    # then skipped), when the run was cancelled, or for refs that are not release tags. A rejected
    # environment approval also appears as a failed build; see docs/ci-secrets-hardening.md.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && github.event.deleted != true && needs.plan.outputs.protected == 'true' && needs.relay-test.result == 'success' && (needs.relay-deploy.result == 'success' || needs.relay-deploy.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source and release notes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Only the verified signed APK WITH the model is ever downloaded here; the model-free artifact never reaches a release.
      - name: Download verified signed APK with the model
        id: download
        if: needs.build.result == 'success' && needs.build.outputs.artifact_name == 'ig-guard-signed-apk' && needs.build.outputs.signed_verified == 'true' && needs.build.outputs.model_packaged == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ig-guard-release-apk
          path: release-artifacts

      - name: Publish release or notes-only fallback
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          APK_VERIFIED: ${{ needs.build.outputs.signed_verified }}
          MODEL_PACKAGED: ${{ needs.build.outputs.model_packaged }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
        run: bash scripts/publish-release.sh
