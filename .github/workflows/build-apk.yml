name: Build IG Guard APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Assemble Android project structure
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/app/family/igguard
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          cp -R ui-res/. app/src/main/res/
          cp FamilySecurity.kt FamilyEvidence.kt app/src/main/java/app/family/igguard/

          if [ -f MainActivity.kt ] && grep -q "object GuardEngine" MainActivity.kt; then
            sed "s/^package .*/package app.family.igguard/" MainActivity.kt > app/src/main/java/app/family/igguard/MainActivity.kt
          elif [ -f MainActivity_v4.kt ] && grep -q "object GuardEngine" MainActivity_v4.kt; then
            sed "s/^package .*/package app.family.igguard/" MainActivity_v4.kt > app/src/main/java/app/family/igguard/MainActivity.kt
          else
            echo "ERROR: No MainActivity source containing GuardEngine was found." >&2
            exit 1
          fi


          VER_CODE=$((100 + ${{ github.run_number }}))

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "IGGuard"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
          }
          EOF

          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'app.family.igguard'
              compileSdk 34

              defaultConfig {
                  applicationId "app.family.igguard"
                  minSdk 26
                  targetSdk 34
                  versionCode $VER_CODE
                  versionName "4.6"
              }

              signingConfigs {
                  privateRelease {
                      if (System.getenv('APK_KEYSTORE_PATH')) {
                          storeFile file(System.getenv('APK_KEYSTORE_PATH'))
                          storePassword System.getenv('APK_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('APK_KEY_ALIAS')
                          keyPassword System.getenv('APK_KEY_PASSWORD')
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      if (System.getenv('APK_KEYSTORE_PATH')) signingConfig signingConfigs.privateRelease
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">IG Guard</string>
              <string name="acc_desc">Keeps Instagram notifications enabled and protects teens from explicit messages.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="200"
              android:packageNames="com.instagram.android" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <permission android:name="app.family.igguard.INTERNAL" android:protectionLevel="signature" />
              <uses-permission android:name="app.family.igguard.INTERNAL" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@xml/private_data_rules"
                  android:usesCleartextTraffic="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <meta-data android:name="isMonitoringTool" android:value="child_monitoring" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="igguard" android:host="pair" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ParentAlertService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <service
                      android:name=".IgNotificationListener"
                      android:label="IG Guard DM Reader"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".IgAccessibilityService"
                      android:label="IG Guard Anti-Tamper"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Run regression checks
        run: |
          python3 -m unittest discover -s tests -p 'check_*.py'
          mkdir -p app/src/test/java/app/family/igguard
          cp tests/*Test.kt app/src/test/java/app/family/igguard/
          cat >> app/build.gradle <<'EOF'
          android { testOptions {
              unitTests.includeAndroidResources = true
              unitTests.all { maxHeapSize = '1g' }
          } }
          dependencies {
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.json:json:20240303'
              testImplementation 'org.robolectric:robolectric:4.14.1'
          }
          EOF
          gradle testDebugUnitTest --no-daemon

      - name: Compile APK
        id: package
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$APK_KEYSTORE_BASE64" "$APK_KEYSTORE_PASSWORD" "$APK_KEY_ALIAS" "$APK_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" != 0 ] && [ "$configured" != 4 ]; then
            echo "Configure all four APK signing secrets; partial signing configuration is rejected." >&2
            exit 1
          fi
          unset APK_KEYSTORE_PATH
          if [ "$configured" = 4 ]; then
            umask 077
            export APK_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/ig-guard-key.XXXXXX")"
            trap 'rm -f "$APK_KEYSTORE_PATH" "$APK_KEYSTORE_PATH.csr"' EXIT
            if ! printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$APK_KEYSTORE_PATH"; then
              echo "::error::[SIGNING_BASE64] APK_KEYSTORE_BASE64 is not valid Base64. Supply the encoded keystore contents, not a filename."
              exit 1
            fi
            if ! keytool -list -keystore "$APK_KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD </dev/null >/dev/null 2>&1; then
              echo "::error::[SIGNING_STORE] The decoded keystore cannot be opened with APK_KEYSTORE_PASSWORD. Verify that password on the exact local file and replace the Base64 secret from that file."
              exit 1
            fi
            if ! keytool -list -keystore "$APK_KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD -alias "$APK_KEY_ALIAS" </dev/null >/dev/null 2>&1; then
              echo "::error::[SIGNING_ALIAS] The keystore opened successfully, but APK_KEY_ALIAS does not identify an entry in it."
              exit 1
            fi
            if ! keytool -certreq -keystore "$APK_KEYSTORE_PATH" -storepass:env APK_KEYSTORE_PASSWORD -alias "$APK_KEY_ALIAS" -keypass:env APK_KEY_PASSWORD -file "$APK_KEYSTORE_PATH.csr" </dev/null >/dev/null 2>&1; then
              echo "::error::[SIGNING_KEY_PASSWORD] The keystore and alias are valid, but the private key cannot be used with APK_KEY_PASSWORD. If you used one password, put that same value in both password secrets."
              exit 1
            fi
            echo "Signing keystore, alias and private-key password verified."
            artifact_name=ig-guard-signed-apk
          else
            artifact_name=ig-guard-unsigned-apk
            echo "Signing secrets are not configured. This unsigned APK requires private signing before installation. See docs/signing.md." >> "$GITHUB_STEP_SUMMARY"
          fi
          gradle assembleRelease --no-daemon
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: app/build/outputs/apk/release/*.apk
