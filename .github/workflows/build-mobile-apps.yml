name: Build Android APK & iOS Xcode App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: BUILD ANDROID APK & GOOGLE PLAY AAB (With Native Kotlin Bridge)
  # =========================================================================
  build-android:
    name: Build Android APK & Play Store Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Capacitor & Generate Native Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Enable Kotlin Support in Capacitor Android App Module
        run: |
          # Ensure Kotlin Gradle plugin is available in android/app/build.gradle
          sed -i "s/apply plugin: 'com.android.application'/apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'/g" android/app/build.gradle
          sed -i "s/dependencies {/dependencies {\n    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'/g" android/app/build.gradle
          sed -i "s/dependencies {/dependencies {\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'/g" android/build.gradle

      - name: Copy SocialNotificationListener.kt & Wire MainActivity Bridge
        run: |
          TARGET_DIR="android/app/src/main/java/com/safeguardfamily/app"
          mkdir -p "$TARGET_DIR"

          # 1. Copy SocialNotificationListener.kt into the exact Android package folder
          cp native-android/SocialNotificationListener.kt "$TARGET_DIR/SocialNotificationListener.kt"

          # 2. Update MainActivity.java to forward intercepted DMs directly into www/js/app.js
          cat << 'EOF' > "$TARGET_DIR/MainActivity.java"
          package com.safeguardfamily.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private BroadcastReceiver dmReceiver;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  dmReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          String payloadJson = intent.getStringExtra("payload_json");
                          if (payloadJson != null && getBridge() != null && getBridge().getWebView() != null) {
                              WebView webView = getBridge().getWebView();
                              String jsCode = "if (window.onNativeSocialDM) { window.onNativeSocialDM(" + payloadJson + "); }";
                              webView.post(() -> webView.evaluateJavascript(jsCode, null));
                          }
                      }
                  };

                  IntentFilter filter = new IntentFilter("com.safeguardfamily.app.SOCIAL_DM_INTERCEPTED");
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(dmReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                  } else {
                      registerReceiver(dmReceiver, filter);
                  }
              }

              @Override
              public void onDestroy() {
                  if (dmReceiver != null) {
                      unregisterReceiver(dmReceiver);
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Register NotificationListenerService & App Queries in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # Add <queries> so Android 11+ allows checking if Instagram, TikTok, and Discord are installed
          sed -i 's/<application/<queries><package android:name="com.instagram.android" \/><package android:name="com.zhiliaoapp.musically" \/><package android:name="com.discord" \/><\/queries><application/g' "$MANIFEST"

          # Register SocialNotificationListener service inside <application>
          sed -i 's/<\/application>/<service android:name=".SocialNotificationListener" android:label="SafeGuard Child Shield" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService" \/><\/intent-filter><\/service><\/application>/g' "$MANIFEST"

      - name: Build Downloadable APK and Google Play AAB
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload Downloadable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab

  # =========================================================================
  # JOB 2: BUILD iOS XCODE PROJECT & APP BUNDLE
  # =========================================================================
  build-ios:
    name: Build iOS Xcode Project & App Bundle
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor & Generate Native iOS Xcode Project
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Compile iOS App Bundle via Xcode Cloud Runner
        working-directory: ./ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA for Sideloading / TestFlight
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r SafeGuard-iOS-Unsigned.ipa Payload

      - name: Upload iOS Xcode Workspace & IPA
        uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-iOS-Xcode-And-IPA
          path: |
            SafeGuard-iOS-Unsigned.ipa
            ios/